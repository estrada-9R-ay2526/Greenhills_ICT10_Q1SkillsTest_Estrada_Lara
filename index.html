<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>
</head>

<body>

<main class="receipt-container">

    <header>
        <h1>Menu</h1>
    </header>

    <form id="menuForm">

        <fieldset class="menu-items">
            <legend>Available Items</legend>

            <div class="form-group">
                <input type="checkbox" id="burger" value="150.00">
                <label for="burger">Burger — ₱150.00</label>
            </div>

            <div class="form-group">
                <input type="checkbox" id="fries" value="60.00">
                <label for="fries">Fries — ₱60.00</label>
            </div>

            <div class="form-group">
                <input type="checkbox" id="soda" value="40.00">
                <label for="soda">Soda — ₱40.00</label>
            </div>

            <div class="form-group">
                <input type="checkbox" id="iceCream" value="50.00">
                <label for="iceCream">Ice Cream — ₱50.00</label>
            </div>

        </fieldset>

        <section class="live-totals">

            <p>
                Subtotal:
                <span id="displaySubtotal">₱0.00</span>
            </p>

            <p>
                VAT (12%):
                <span id="displayVat">₱0.00</span>
            </p>

            <p>
                <strong>
                    Total Amount:
                    <span id="displayTotal">₱0.00</span>
                </strong>
            </p>

        </section>

        <button type="button" py-click="create_order" id="btnreceipt">
            Generate Receipt
        </button>

        <div id="show"></div>

    </form>

    <hr>

    <section class="receipt-output">
        <h2>Your Receipt</h2>
    </section>

</main>

<py-script src="main.py"></py-script>

</body>
</html>
